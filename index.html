<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Marcelle Queiroz — UX/UI Designer & iOS Dev</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">

        <div class="language-switch">
             <button class="language active" data-language="pt">Português 🇧🇷</button>
             <button class="language" data-language="en">Inglês 🇺🇸</button>
        </div>

        <nav class="navigation" aria-label="Navegação principal">
            <a href="#home" class="nav-link active" data-tab="home">
                Home
            </a>
            <div class="projects-nav-wrap">
                <a href="#projetos" class="nav-link project-nav" data-tab="projetos">
                    <span data-i18n="nav.projects">Projetos</span>
                </a>
                <div class="projects-modal" id="projects-modal" aria-label="Lista de projetos">
                    <button type="button" class="project-option" data-project="Altroo">Altroo</button>
                    <button type="button" class="project-option" data-project="Hanka">Hanka</button>
                    <button type="button" class="project-option" data-project="Monitor Pronatec">Monitor Pronatec</button>
                    <button type="button" class="project-option" data-project="Into The Cauldron">Into The Cauldron</button>
                </div>
            </div>
            <a href="#sobre" class="nav-link" data-tab="sobre">
                <span data-i18n="nav.about">Sobre</span>
            </a>
        </nav>

        <a href="https://drive.google.com/file/d/10igtKQ63M4ydT_5mw3jInMhqyHYmSDTR/view?usp=sharing" class="resume-button">
            <span data-i18n="nav.resume">Baixar currículo</span>
        </a>

    </header>


    <main id="page-content">
        <!-- Home page content loads here -->
    </main>

    <!-- Project Detail Section -->
    <section id="project-detail" class="tab-panel project-detail-section" aria-live="polite"></section>


    <!-- FOOTER -->
    <footer class="footer">

        <strong>Marcelle Queiroz</strong>

        <span data-i18n="footer.rights">
            © 2026 Marcelle Queiroz. Todos os direitos reservados.
        </span>

    </footer>


    <script src="script.js"></script>

</body>

</html>
